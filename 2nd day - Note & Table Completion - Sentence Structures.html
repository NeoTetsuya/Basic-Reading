<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Reading Practice — Day 2: Note & Table Completion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --app-font-size: 17px;
        }
        body {
            font-family: 'Inter', sans-serif;
            overscroll-behavior: none;
            background-color: #f8fafc;
        }
        .ielts-container {
            display: grid;
            grid-template-rows: auto 1fr auto;
            height: 100vh;
        }
        .content-panes {
            display: grid;
            grid-template-columns: 1fr 5px 1fr;
            overflow: hidden;
        }
        .pane {
            overflow-y: auto;
            padding: 2rem 2.5rem;
            font-size: var(--app-font-size);
            scroll-behavior: smooth;
        }
        #left-pane {
            background-color: #ffffff;
        }
        #right-pane {
            background-color: #f8fafc;
        }
        .splitter {
            background-color: #cbd5e1;
            cursor: col-resize;
            z-index: 10;
            transition: background-color 0.2s;
        }
        .splitter:hover, .splitter:active {
            background-color: #0284c7;
        }
        
        /* Reading Passage Typography - Left Aligned for legibility */
        .reading-passage {
            font-family: 'Merriweather', serif;
            line-height: 1.95;
            color: #334155;
            text-align: left;
            margin-bottom: 2rem;
            max-width: 820px;
            margin: 0 auto;
        }
        .reading-passage p {
            margin-bottom: 1.5rem;
            text-indent: 1.5rem;
        }
        .reading-passage h3 {
            font-family: 'Inter', sans-serif;
            color: #0f172a;
            margin-bottom: 1.5rem;
            font-weight: 700;
            font-size: 1.55em;
            text-align: center;
            text-indent: 0;
            letter-spacing: -0.01em;
        }
        .paragraph-label {
            float: left;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 1.05em;
            margin-right: 0.5rem;
            color: #0284c7;
            text-indent: 0;
            background: #e0f2fe;
            padding: 2px 8px;
            border-radius: 4px;
        }

        /* Question & Input Styling */
        .q-card {
            padding: 1.25rem;
            border-radius: 0.75rem;
            transition: all 0.2s;
            background-color: white;
            border: 1px solid #e2e8f0;
            margin-bottom: 1.25rem;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.03);
        }
        .text-input {
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            padding: 5px 10px;
            font-weight: 600;
            color: #0f172a;
            transition: all 0.2s;
            background-color: #ffffff;
        }
        .text-input:focus {
            outline: none;
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }
        .inline-input {
            display: inline-block;
            margin: 0 4px;
            width: 150px;
            vertical-align: middle;
        }

        /* Interactive Vocabulary Terms */
        .vocab-word {
            color: #0284c7;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px dotted #38bdf8;
            transition: all 0.2s ease-in-out;
            padding: 0 2px;
        }
        .vocab-word:hover {
            background-color: #e0f2fe;
            border-bottom-style: solid;
            border-radius: 2px;
        }

        /* Highlighting Tool */
        .highlight-tooltip {
            position: absolute;
            background-color: #0f172a;
            color: white;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            z-index: 100;
            cursor: pointer;
            display: none;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
        }
        mark {
            background-color: #fef08a;
            border-radius: 3px;
            padding: 2px 0;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        mark:hover {
            background-color: #fca5a5;
            color: #7f1d1d;
        }

        /* Navigation Tab Buttons */
        .tab-btn {
            transition: all 0.2s;
        }
        .tab-btn.active {
            background-color: #0284c7;
            color: #ffffff;
            border-color: #0284c7;
            box-shadow: 0 2px 4px rgba(2, 132, 199, 0.2);
        }

        @media (max-width: 768px) {
            .content-panes {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 5px 1fr;
            }
            .splitter {
                cursor: row-resize;
            }
            .pane {
                padding: 1.25rem;
            }
        }
    </style>
</head>
<body>

<div id="test-container" class="ielts-container">
    <!-- Header -->
    <header class="bg-white border-b border-gray-200 px-4 sm:px-6 py-3.5 flex justify-between items-center z-20 shadow-sm">
        <div class="flex items-center space-x-3">
            <div class="bg-sky-600 text-white p-2 rounded-lg hidden sm:block">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                </svg>
            </div>
            <div>
                <h1 class="text-lg sm:text-xl font-bold text-gray-800">IELTS Academic Reading <span class="text-sky-600 font-medium hidden md:inline">| Day 2: Note & Table Completion</span></h1>
            </div>
        </div>

        <div class="flex items-center space-x-3 sm:space-x-4">
            <div class="flex items-center space-x-2 border-r border-gray-200 pr-3 sm:pr-4">
                <span class="text-sm text-gray-500 font-medium hidden sm:inline">Name:</span>
                <input type="text" id="student-name" class="border border-gray-300 rounded px-2.5 py-1 text-sm w-28 sm:w-40 focus:outline-none focus:ring-2 focus:ring-sky-400" placeholder="Your Name">
            </div>

            <button id="clear-highlights-btn" class="hidden sm:flex items-center justify-center px-3 py-1.5 rounded-lg bg-amber-50 hover:bg-amber-100 text-amber-700 transition-colors focus:outline-none border border-amber-200 text-xs font-semibold" title="Clear Highlights">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
                Clear
            </button>

            <div class="flex items-center space-x-1 bg-gray-100 p-1 rounded-lg border border-gray-200">
                <button id="decrease-font-btn" class="w-8 h-8 flex items-center justify-center rounded bg-white shadow-sm hover:bg-gray-50 text-gray-700 transition-colors focus:outline-none font-bold text-sm" title="Decrease Font Size">A-</button>
                <button id="increase-font-btn" class="w-8 h-8 flex items-center justify-center rounded bg-white shadow-sm hover:bg-gray-50 text-gray-700 transition-colors focus:outline-none font-bold text-sm" title="Increase Font Size">A+</button>
            </div>
        </div>
    </header>

    <!-- Content Panes -->
    <main id="content-panes" class="content-panes">
        <!-- Left Pane: Reading Passage -->
        <div id="left-pane" class="pane">
            <div id="passage-container" class="reading-passage">
                <!-- Loaded dynamically by JS -->
            </div>
        </div>

        <!-- Splitter -->
        <div id="splitter" class="splitter relative flex items-center justify-center">
            <div class="w-1 h-8 bg-gray-400 rounded-full opacity-50"></div>
        </div>

        <!-- Right Pane: Questions & Exercises -->
        <div id="right-pane" class="pane">
            <div id="questions-container" class="max-w-2xl mx-auto pb-10">
                <!-- Loaded dynamically by JS -->
            </div>
        </div>
    </main>

    <!-- Footer Tabs Navigation -->
    <footer class="bg-white border-t border-gray-200 p-3 flex flex-wrap justify-center items-center gap-2 z-20 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
        <div id="tab-navigation" class="flex flex-wrap justify-center gap-1.5 sm:gap-2">
            <!-- Tabs generated dynamically by JS -->
        </div>
    </footer>
</div>

<!-- Highlight Tooltip -->
<div id="highlight-tooltip" class="highlight-tooltip">Highlight Text</div>

<!-- Vocabulary Modal -->
<div id="vocab-modal" class="fixed inset-0 bg-gray-900 bg-opacity-50 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50 transition-opacity">
    <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md relative transform transition-all scale-95 opacity-0" id="vocab-modal-content">
        <button id="close-vocab-modal" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-full w-8 h-8 flex items-center justify-center transition-colors">&times;</button>
        <div class="flex items-center mb-6 border-b pb-4">
            <h3 id="vocab-word" class="text-3xl font-extrabold text-gray-900 capitalize tracking-tight"></h3>
        </div>
        <div class="flex items-center mb-5">
            <button id="play-audio-btn" class="flex items-center justify-center h-12 w-12 rounded-full bg-sky-50 text-sky-600 hover:bg-sky-600 hover:text-white mr-4 transition-all shadow-sm border border-sky-100" title="Listen to pronunciation">
                 <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
            </button>
            <p id="vocab-pronunciation-text" class="text-gray-500 font-mono text-lg bg-gray-50 px-3 py-1 rounded-md border border-gray-100"></p>
        </div>
        <p id="vocab-meaning" class="text-gray-700 text-lg leading-relaxed"></p>
    </div>
</div>

<script>
    const vocabularyDict = {
        'rebelling': { meaning: 'Resisting or challenging authority, control, or traditional rules.', phonetic: '/rɪˈbelɪŋ/' },
        'flappers': { meaning: 'Young women in the 1920s who wore short skirts and behaved in a fashionable, unconventional manner.', phonetic: '/ˈflæpəz/' },
        'obnoxious': { meaning: 'Extremely unpleasant, offensive, or objectionable.', phonetic: '/əbˈnɒkʃəs/' },

        'vulnerable': { meaning: 'Exposed to the possibility of being attacked or harmed.', phonetic: '/ˈvʌlnərəbl/' },
        'colonisers': { meaning: 'People or nations that establish control over indigenous people of an area.', phonetic: '/ˈkɒlənaɪzəz/' },
        'depleted': { meaning: 'Used up or reduced significantly in quantity.', phonetic: '/dɪˈpliːtɪd/' },
        'sanctuaries': { meaning: 'Safe places or reserves set aside for protection.', phonetic: '/ˈsæŋktʃuəriz/' },
        'propulsion': { meaning: 'The action of driving or pushing forward.', phonetic: '/prəˈpʌlʃn/' },
        'omnivorous': { meaning: 'Feeding on food of both plant and animal origin.', phonetic: '/ɒmˈnɪvərəs/' },
        'buoyancy': { meaning: 'The ability or tendency to float in water or other fluids.', phonetic: '/ˈbɔɪənsi/' },
        'phenology': { meaning: 'The study of cyclic and seasonal natural phenomena in relation to climate and plant/animal life.', phonetic: '/fəˈnɒlədʒi/' },
        'coppiced': { meaning: 'Woodland managed by periodically cutting back trees to ground level to stimulate growth.', phonetic: '/ˈkɒpɪst/' },
        'foraging': { meaning: 'Searching for food or provisions.', phonetic: '/ˈfɒrɪdʒɪŋ/' },
        'susceptible': { meaning: 'Likely or liable to be influenced or harmed by a particular thing.', phonetic: '/səˈseptəbl/' },
        'roosting': { meaning: 'Settling or resting, especially birds or bats at night.', phonetic: '/ˈruːstɪŋ/' },
        'megalithic': { meaning: 'Relating to or denoting structures made of large stones.', phonetic: '/ˌmeɡəˈlɪθɪk/' },
        'solstice': { meaning: 'Either of the two times in the year when the sun reaches its highest or lowest point in the sky at noon.', phonetic: '/ˈsɒlstɪs/' }

    const tabsData = [
        // Tab 1: Example 1 - Women's Fashion
        {
            id: 'ex1',
            label: 'Ex 1: Women\'s Fashion',
            title: 'Fashion History Note Completion',
            passage: `
                <h3>Women's Fashion History</h3>
                <p>From 1920, women started <span class="vocab-word" data-word="rebelling">rebelling</span> against old restricted clothes and started wearing casual clothes such as trousers and short skirts. A big development came when women were starting to be called “<span class="vocab-word" data-word="flappers">Flappers</span>” for their new breed of young women that decided to go against outdated regulations by flaunting their skin that was known to be unacceptable.</p>
                <p>In the 1930’s the big thing was that dresses often included an overcoat. They were very popular in the thirties with any pattern that wasn’t too <span class="vocab-word" data-word="obnoxious">obnoxious</span> and was very popular for women, like flowery dresses for instance. Although women were wearing dresses they were still not allowed to show much skin. Even celebrities wore long dresses with their hair close to their head.</p>
                <p>Women’s fashion in the 1940’s defiantly got a little bit more modern. Although the fashion industry was held down by World War 2 regulations, that didn’t stop women from wearing and making their elegant clothes, which was then often accompanied with certain accessories like gloves. They were a well-known thing in the forties, which is why in almost every photos back then, women are pictured wearing gloves. Also, a big thing was rain-jackets with fur. This was to keep women warm throughout the rain and snow. Later on, due to the high demand in fabrics for World War 2, there were limited quantities of fabric for women to use, so they had to stick with a simple outfit.</p>
                <p>The early sixties women’s fashion was more conservative and formal. However, that quickly changed when music started influencing society. Women started wearing short skirts, tie-dye shirts, basically anything with bright and swirling colours. This was a big event in fashion history because women were baring their skin like never before.</p>
            `,
            questions: `
                <div class="q-card">
                    <div class="flex items-center mb-3">
                        <span class="bg-sky-100 text-sky-800 text-xs font-bold px-3 py-1 rounded-full mr-2 uppercase">Questions 1–3</span>
                        <h4 class="font-bold text-gray-800 text-sm sm:text-base">Notes Completion</h4>
                    </div>
                    <p class="text-sm text-gray-600 bg-sky-50/70 p-3 rounded-lg border border-sky-100 mb-4">
                        Complete the notes below. Choose <strong>NO MORE THAN TWO WORDS</strong> from the passage for each answer.
                    </p>
                    
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm border-collapse border border-gray-200">
                            <thead>
                                <tr class="bg-sky-50 text-sky-900 border-b border-gray-200">
                                    <th class="p-3 border-r border-gray-200 font-bold w-1/4">Decade</th>
                                    <th class="p-3 font-bold">Fashion Notes</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-200 text-gray-800">
                                <tr>
                                    <td class="p-3 border-r border-gray-200 font-semibold bg-gray-50">1920</td>
                                    <td class="p-3 leading-relaxed">
                                        Women preferred <strong>1.</strong> <input type="text" class="text-input inline-input" placeholder="..."> to restricted ones.<br>
                                        Young women who rebelled against outdated rules were called “Flappers”.
                                    </td>
                                </tr>
                                <tr>
                                    <td class="p-3 border-r border-gray-200 font-semibold bg-gray-50">1930</td>
                                    <td class="p-3 leading-relaxed">
                                        Dresses (include an overcoat): popular with simple <strong>2.</strong> <input type="text" class="text-input inline-input" placeholder="...">.
                                    </td>
                                </tr>
                                <tr>
                                    <td class="p-3 border-r border-gray-200 font-semibold bg-gray-50">1940</td>
                                    <td class="p-3 leading-relaxed">
                                        Clothes: become more modern, often worn with <strong>3.</strong> <input type="text" class="text-input inline-input" placeholder="...">.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            `
        },
        // Tab 2: Practice 1 - Dartmouth Test
        {
            id: 'prac1',
            label: 'Prac 1: Dartmouth Study',
            title: 'Engineering & Physics Study Note Completion',
            passage: `
                <h3>Dartmouth Engineering Study</h3>
                <p><span class="paragraph-label">D</span> Twenty-eight Dartmouth students participated in the study, broken into two equal groups: engineering students and <span class="vocab-word" data-word="novices">novices</span>. Engineering students had taken at least one mechanical engineering course and an advanced physics course, whereas novices had not taken any college-level engineering or physics classes. The study was comprised of three tests, which focused on how structures were built and assessed participants’ understanding of Newton’s third law - for every action there is an equal and opposite reaction. Newton’s third law is often used to describe the interactions of objects in motion, but it also applies to objects that are static, or non-moving: all of the forces in a static structure need to be in <span class="vocab-word" data-word="equilibrium">equilibrium</span>, a principle fundamental to understanding whether a structure will collapse under its own weight or whether it can support more weight.</p>
                <p><span class="paragraph-label">E</span> At the start of the study, participants were provided with a brief overview of the different types of forces in mechanical engineering. In an fMRI scanner, they were presented with images of real-world structures (bridges, lampposts, buildings, and more) and were asked to think about how the forces in a given structure balanced out to keep the structure in equilibrium. Then, participants were prompted with a subsequent image of the same structure, where arrows representing forces were overlaid onto the structure. Participants were asked to identify if the Newtonian forces had been labelled correctly in this diagram. Engineering students (intermediate learners) answered 75 percent of the diagrams correctly and outperformed the novices, who answered 53.6 percent correctly.</p>
            `,
            questions: `
                <div class="q-card">
                    <div class="flex items-center mb-3">
                        <span class="bg-sky-100 text-sky-800 text-xs font-bold px-3 py-1 rounded-full mr-2 uppercase">Questions 1–5</span>
                        <h4 class="font-bold text-gray-800 text-sm sm:text-base">Notes Completion</h4>
                    </div>
                    <p class="text-sm text-gray-600 bg-sky-50/70 p-3 rounded-lg border border-sky-100 mb-4">

                        <p><strong>Engineering students:</strong> had knowledge about mechanical engineering and physics.</p>

                        <p><strong>Result:</strong> the intermediate students <strong>5.</strong> <input type="text" class="text-input inline-input" placeholder="..."> the novices.</p>

        // Tab 3: Practice 2 - Kakapo
        {
            id: 'prac2',
            label: 'Prac 2: Kākāpō',
            title: 'New Zealand’s Kākāpō Note Completion',
            passage: `
                <h3>New Zealand’s Kākāpō</h3>
                <p>Kākāpō are <span class="vocab-word" data-word="solitary">solitary</span> birds and tend to occupy the same home range for many years. They forage on the ground and climb high into trees. They often leap from trees and flap their wings, but at best manage a controlled descent to the ground. They are entirely vegetarian, with their diet including the leaves, roots and bark of trees as well as bulbs, and fern fronds.</p>
                <p>Kākāpō breed in summer and autumn, but only in years when food is plentiful. Males play no part in <span class="vocab-word" data-word="incubation">incubation</span> or chick-rearing – females alone incubate eggs and feed the chicks. The 1-4 eggs are laid in soil, which is repeatedly turned over before and during incubation. The female kākāpō has to spend long periods away from the nest searching for food, which leaves the unattended eggs and chicks particularly <span class="vocab-word" data-word="vulnerable">vulnerable</span> to predators.</p>
                <p>Before humans arrived, kākāpō were common throughout New Zealand’s forests. However, this all changed with the arrival of the first Polynesian settlers about 700 years ago. For the early settlers, the flightless kākāpō was easy prey. They ate its meat and used its feathers to make soft cloaks. With them came the Polynesian dog and rat, which also preyed on kākāpō. By the time European <span class="vocab-word" data-word="colonisers">colonisers</span> arrived in the early 1800s, kākāpō had become confined to the central North Island and forested parts of the South Island. The fall in kākāpō numbers was accelerated by European colonisation. A great deal of habitat was lost through forest clearance, and introduced species such as deer <span class="vocab-word" data-word="depleted">depleted</span> the remaining forests of food. Other predators such as cats, stoats and two more species of rat were also introduced. The kākāpō were in serious trouble.</p>
                <p>In 1894, the New Zealand government launched its first attempt to save the kākāpō. Conservationist Richard Henry led an effort to relocate several hundred of the birds to predator-free Resolution Island in Fiordland. Unfortunately, the island didn’t remain predator free – stoats arrived within six years, eventually destroying the kākāpō population. By the mid-1900s, the kākāpō was practically a lost species. Only a few clung to life in the most isolated parts of New Zealand.</p>
                <p>Unfortunately, predation by feral cats on Rakiura Island led to a rapid decline in kākāpō numbers. As a result, during 1980-97, the surviving population was evacuated to three island <span class="vocab-word" data-word="sanctuaries">sanctuaries</span>: Codfish Island, Maud Island and Little Barrier Island. However, breeding success was hard to achieve. Rats were found to be a major predator of kākāpō chicks and an insufficient number of chicks survived to offset adult mortality. By 1995, although at least 12 chicks had been produced on the islands, only three had survived. The kākāpō population had dropped to 51 birds. The critical situation prompted an urgent review of kākāpō management in New Zealand.</p>
                <p>After the first five years of the Recovery Plan, the population was on target. By 2000, five new females had been produced, and the total population had grown to 62 birds. For the first time, there was cautious optimism for the future of kākāpō and by June 2020, a total of 210 birds was recorded.</p>
                <p>Today, kākāpō management continues to be guided by the kākāpō Recovery Plan. Its key goals are: minimise the loss of genetic diversity in the kākāpō population, restore or maintain sufficient habitat to accommodate the expected increase in the kākāpō population, and ensure stakeholders continue to be fully engaged in the preservation of the species.</p>
            `,
            questions: `
                <div class="q-card">
                    <div class="flex items-center mb-3">
                        <span class="bg-sky-100 text-sky-800 text-xs font-bold px-3 py-1 rounded-full mr-2 uppercase">Questions 7–13</span>
                        <h4 class="font-bold text-gray-800 text-sm sm:text-base">Notes Completion</h4>

                <h3>Manatees</h3>
                <p>Manatees, also known as sea cows, are aquatic mammals that belong to a group of animals called Sirenia. This group also contains dugongs. Dugongs and manatees look quite alike – they are similar in size, colour and shape, and both have flexible flippers for forelimbs. However, the manatee has a broad, rounded tail, whereas the dugong’s is fluked, like that of a whale. There are three species of manatees: the West Indian manatee (Trichechus manatus), the African manatee (Trichechus senegalensis) and the Amazonian manatee (Trichechus inunguis).</p>
                <p>Unlike most mammals, manatees have only six bones in their neck – most others, including humans and giraffes, have seven. This short neck allows a manatee to move its head up and down, but not side to side. To see something on its left or its right, a manatee must turn its entire body, steering with its flippers. Manatees have pectoral flippers but no back limbs, only a tail for <span class="vocab-word" data-word="propulsion">propulsion</span>. They do have pelvic bones, however – a leftover from their evolution from a four-legged to a fully aquatic animal. Manatees share some visual similarities to elephants. Like elephants, manatees have thick, wrinkled skin. They also have some hairs covering their bodies which help them sense vibrations in the water around them.</p>
                <p>Seagrasses and other marine plants make up most of a manatee’s diet. Manatees spend about eight hours each day grazing and uprooting plants. They eat up to 15% of their weight in food each day. African manatees are <span class="vocab-word" data-word="omnivorous">omnivorous</span> – studies have shown that molluscs and fish make up a small part of their diets. West Indian and Amazonian manatees are both herbivores.</p>
                <p>Manatees’ teeth are all molars – flat, rounded teeth for grinding food. Due to manatees’ abrasive aquatic plant diet, these teeth get worn down and they eventually fall out, so they continually grow new teeth that get pushed forward to replace the ones they lose. Instead of having incisors to grasp their food, manatees have lips which function like a pair of hands to help tear food away from the seafloor.</p>
                <p>Manatees are fully aquatic, but as mammals, they need to come up to the surface to breathe. When awake, they typically surface every two to four minutes, but they can hold their breath for much longer. Adult manatees sleep underwater for 10–12 hours a day, but they come up for air every 15 – 20 minutes. Active manatees need to breathe more frequently. It’s thought that manatees use their muscular diaphragm and breathing to adjust their <span class="vocab-word" data-word="buoyancy">buoyancy</span>. They may use diaphragm contractions to compress and store gas in folds in their large intestine to help them float.</p>

                <h3>Stonehenge</h3>
                <p>Archaeologists believe England’s most iconic prehistoric ruin was built in several stages with the earliest constructed 5,000 or more years ago. First, Neolithic Britons used primitive tools, which may have been fashioned out of deer antlers, to dig a massive circular ditch and bank, or henge. Deep pits dating back to that era and located within the circle may have once held a ring of timber posts, according to some scholars.</p>

                <p>But who were the builders of Stonehenge? In the 17th century, archaeologist John Aubrey made the claim that Stonehenge was the work of druids, who had important religious, judicial and political roles in Celtic society. This theory was widely popularized by the antiquarian William Stukeley, who had unearthed primitive graves at the site. Even today, people who identify as modern druids continue to gather at Stonehenge for the summer <span class="vocab-word" data-word="solstice">solstice</span>. However, in the mid-20th century, radiocarbon dating demonstrated that Stonehenge stood more than 1,000 years before the Celts inhabited the region.</p>

                            this.loadTabData(this.currentTab);
                        }
                    });
                });
            },

            updateActiveTabUI() {
                this.tabNav.querySelectorAll('.tab-btn').forEach((btn, idx) => {
                    if (idx === this.currentTab) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
            },

            loadTabData(index) {
                const data = tabsData[index];
                this.passageContainer.innerHTML = data.passage;
                this.questionsContainer.innerHTML = data.questions;
                this.leftPane.scrollTop = 0;
                this.rightPane.scrollTop = 0;
            },

            setupEventListeners() {
                // Font Resizing
                document.getElementById('increase-font-btn').addEventListener('click', () => this.changeFontSize(1));
                document.getElementById('decrease-font-btn').addEventListener('click', () => this.changeFontSize(-1));

                // Clear Highlights
                if (this.clearHighlightsBtn) {
                    this.clearHighlightsBtn.addEventListener('click', () => {
                        const marks = this.leftPane.querySelectorAll('mark');
                        marks.forEach(mark => {
                            const text = document.createTextNode(mark.textContent);
                            mark.replaceWith(text);
                        });
                    });
                }

                // Vocab Modal Closing
                this.closeVocabModalBtn.addEventListener('click', () => this.closeModal());
                this.vocabModal.addEventListener('click', (e) => {
                    if (e.target === this.vocabModal) this.closeModal();
                });

                // Click handler for vocabulary words in text
                this.leftPane.addEventListener('click', (e) => {
                    if (e.target.classList.contains('vocab-word')) {
                        const wordKey = e.target.dataset.word;
                        this.openVocabModal(wordKey);
                    }
                    if (e.target.tagName === 'MARK') {
                        const textNode = document.createTextNode(e.target.textContent);
                        e.target.replaceWith(textNode);
                    }
                });

                // Audio Pronunciation TTS
                this.playAudioBtn.addEventListener('click', () => {
                    const word = this.vocabWordEl.textContent;
                    if (!word) return;
                    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                    
                    this.playAudioBtn.classList.remove('text-sky-600', 'bg-sky-50');
                    this.playAudioBtn.classList.add('bg-emerald-500', 'text-white');
                    
                    if ('speechSynthesis' in window) {
                        const utterance = new SpeechSynthesisUtterance(word);
                        utterance.lang = 'en-GB'; 
                        utterance.rate = 0.9; 
                        utterance.onend = () => this.resetAudioBtn();
                        utterance.onerror = () => this.resetAudioBtn();
                        window.speechSynthesis.speak(utterance);
                    } else {
                        setTimeout(() => this.resetAudioBtn(), 500);
                    }
                });
            },

            resetAudioBtn() {
                this.playAudioBtn.classList.add('text-sky-600', 'bg-sky-50');
                this.playAudioBtn.classList.remove('bg-emerald-500', 'text-white');
            },

            changeFontSize(delta) {
                this.currentFontSize += delta;
                if (this.currentFontSize < 14) this.currentFontSize = 14;
                if (this.currentFontSize > 26) this.currentFontSize = 26;
                document.documentElement.style.setProperty('--app-font-size', `${this.currentFontSize}px`);
            },

            openVocabModal(wordKey) {
                const data = vocabularyDict[wordKey] || { meaning: 'Definition available in context.', phonetic: '' };
                this.vocabWordEl.textContent = wordKey;
                this.vocabMeaningEl.textContent = data.meaning;
                this.vocabPronunciationText.textContent = data.phonetic || '';
                this.vocabModal.classList.remove('hidden');
                setTimeout(() => {
                    this.vocabModalContent.classList.remove('scale-95', 'opacity-0');
                    this.vocabModalContent.classList.add('scale-100', 'opacity-100');
                }, 10);
            },

            closeModal() {
                if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                this.vocabModalContent.classList.remove('scale-100', 'opacity-100');
                this.vocabModalContent.classList.add('scale-95', 'opacity-0');
                this.resetAudioBtn();
                setTimeout(() => this.vocabModal.classList.add('hidden'), 200);
            },

            initHighlighter() {
                document.body.addEventListener('mouseup', (e) => {
                    const selection = window.getSelection();
                    const selectedText = selection.toString().trim();

                    if (selectedText.length > 0) {
                        const range = selection.getRangeAt(0);
                        if (!this.leftPane.contains(range.commonAncestorContainer) && !this.rightPane.contains(range.commonAncestorContainer)) {
                            this.highlightTooltip.style.display = 'none';
                            return;
                        }

                        this.highlightTooltip.style.left = `${e.pageX - 30}px`;
                        this.highlightTooltip.style.top = `${e.pageY - 40}px`;
                        this.highlightTooltip.style.display = 'block';

                        this.highlightTooltip.onclick = () => {
                            const container = range.commonAncestorContainer;
                            if (container.nodeType === 3 && range.startContainer.parentElement !== range.endContainer.parentElement) {
                                this.highlightTooltip.style.display = 'none';
                                return;
                            }
                            
                            const mark = document.createElement('mark');
                            try {
                                range.surroundContents(mark);
                            } catch (ex) {} 
                            finally {
                                selection.removeAllRanges();
                                this.highlightTooltip.style.display = 'none';
                            }
                        };
                    } else {
                        this.highlightTooltip.style.display = 'none';
                    }
                });

                document.body.addEventListener('mousedown', (e) => {
                    if (e.target !== this.highlightTooltip && window.getSelection().toString().length === 0) {
                        this.highlightTooltip.style.display = 'none';
                    }
                });
            },

            initSplitter() {
                let isDragging = false;
                const contentPanes = document.getElementById('content-panes');

                this.splitter.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    isDragging = true;
                    document.body.style.cursor = 'col-resize';
                });

                document.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;
                    e.preventDefault();
                    if (window.innerWidth <= 768) return; 
                    
                    const containerRect = contentPanes.getBoundingClientRect();
                    const newLeftWidth = e.clientX - containerRect.left;
                    if (newLeftWidth > 200 && newLeftWidth < containerRect.width - 200) {
                        const newLeftPercent = (newLeftWidth / containerRect.width) * 100;
                        contentPanes.style.gridTemplateColumns = `${newLeftPercent}% 5px 1fr`;
                    }
                });

                document.addEventListener('mouseup', () => {
                    if (isDragging) {
                        isDragging = false;
                        document.body.style.cursor = 'default';
                    }
                });
            }
        };

        app.init();
    });
</script>

</body>
</html>
