<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Reading Practice - Sentence Completion & Vocabulary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --app-font-size: 17px;
        }
        body {
            font-family: 'Inter', sans-serif;
            overscroll-behavior: none;
            background-color: #f8fafc;
        }
        .ielts-container {
            display: grid;
            grid-template-rows: auto 1fr auto;
            height: 100vh;
        }
        .content-panes {
            display: grid;
            grid-template-columns: 1fr 5px 1fr;
            overflow: hidden;
        }
        .pane {
            overflow-y: auto;
            padding: 2rem 2.5rem;
            font-size: var(--app-font-size);
            scroll-behavior: smooth;
        }
        #left-pane {
            background-color: #ffffff;
        }
        #right-pane {
            background-color: #f8fafc;
        }
        .splitter {
            background-color: #cbd5e1;
            cursor: col-resize;
            z-index: 10;
            transition: background-color 0.2s;
        }
        .splitter:hover, .splitter:active {
            background-color: #0284c7;
        }
        
        .reading-passage {
            font-family: 'Merriweather', serif;
            line-height: 1.95;
            color: #334155;
            text-align: left;
            margin-bottom: 2rem;
            max-width: 820px;
            margin: 0 auto;
        }
        .reading-passage p {
            margin-bottom: 1.5rem;
            text-indent: 1.5rem;
        }
        .reading-passage h3 {
            font-family: 'Inter', sans-serif;
            color: #0f172a;
            margin-bottom: 1.5rem;
            font-weight: 700;
            font-size: 1.55em;
            text-align: center;
            text-indent: 0;
            letter-spacing: -0.01em;
        }
        .paragraph-label {
            float: left;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 1.05em;
            margin-right: 0.5rem;
            color: #0284c7;
            text-indent: 0;
            background: #e0f2fe;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .q-card {
            padding: 1.25rem;
            border-radius: 0.75rem;
            transition: all 0.2s;
            background-color: white;
            border: 1px solid #e2e8f0;
            margin-bottom: 1.25rem;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.03);
        }
        .text-input {
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            padding: 6px 12px;
            font-weight: 600;
            color: #0f172a;
            transition: all 0.2s;
            background-color: #ffffff;
        }
        .text-input:focus {
            outline: none;
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }
        .inline-input {
            display: inline-block;
            margin: 0 4px;
            width: 160px;
            vertical-align: middle;
        }

        .vocab-word {
            color: #0284c7;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px dotted #38bdf8;
            transition: all 0.2s ease-in-out;
            padding: 0 2px;
        }
        .vocab-word:hover {
            background-color: #e0f2fe;
            border-bottom-style: solid;
            border-radius: 2px;
        }

        .highlight-tooltip {
            position: absolute;
            background-color: #0f172a;
            color: white;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            z-index: 100;
            cursor: pointer;
            display: none;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
        }
        mark {
            background-color: #fef08a;
            border-radius: 3px;
            padding: 2px 0;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        mark:hover {
            background-color: #fca5a5;
            color: #7f1d1d;
        }

        .tab-btn {
            transition: all 0.2s;
        }
        .tab-btn.active {
            background-color: #0284c7;
            color: #ffffff;
            border-color: #0284c7;
            box-shadow: 0 2px 4px rgba(2, 132, 199, 0.2);
        }

        @media (max-width: 768px) {
            .content-panes {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 5px 1fr;
            }
            .splitter {
                cursor: row-resize;
            }
            .pane {
                padding: 1.25rem;
            }
        }
    </style>
</head>
<body>

<div id="test-container" class="ielts-container">
    <!-- Header -->
    <header class="bg-white border-b border-gray-200 px-4 sm:px-6 py-3.5 flex justify-between items-center z-20 shadow-sm">
        <div class="flex items-center space-x-3">

                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
                Clear
            </button>

            <div class="flex items-center space-x-1 bg-gray-100 p-1 rounded-lg border border-gray-200">
                <button id="decrease-font-btn" class="w-8 h-8 flex items-center justify-center rounded bg-white shadow-sm hover:bg-gray-50 text-gray-700 transition-colors focus:outline-none font-bold text-sm" title="Decrease Font Size">A-</button>
                <button id="increase-font-btn" class="w-8 h-8 flex items-center justify-center rounded bg-white shadow-sm hover:bg-gray-50 text-gray-700 transition-colors focus:outline-none font-bold text-sm" title="Increase Font Size">A+</button>
            </div>
        </div>
    </header>

    <main id="content-panes" class="content-panes">
        <!-- Left Pane: Reading Passage -->
        <div id="left-pane" class="pane">
            <div id="passage-container" class="reading-passage">
                <!-- Loaded dynamically by JS -->
            </div>
        </div>

        <!-- Splitter -->
        <div id="splitter" class="splitter relative flex items-center justify-center">
            <div class="w-1 h-8 bg-gray-400 rounded-full opacity-50"></div>
        </div>

        <!-- Right Pane: Questions & Exercises -->
        <div id="right-pane" class="pane">
            <div id="questions-container" class="max-w-2xl mx-auto pb-10">
                <!-- Loaded dynamically by JS -->
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-200 p-3 flex flex-wrap justify-center items-center gap-2 z-20 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
        <div id="tab-navigation" class="flex flex-wrap justify-center gap-1.5 sm:gap-2">
            <!-- Tabs generated dynamically by JS -->
        </div>
    </footer>
</div>

<!-- Highlight Tooltip -->
<div id="highlight-tooltip" class="highlight-tooltip">Highlight Text</div>

<!-- Vocabulary Modal -->
<div id="vocab-modal" class="fixed inset-0 bg-gray-900 bg-opacity-50 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50 transition-opacity">
    <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md relative transform transition-all scale-95 opacity-0" id="vocab-modal-content">
        <button id="close-vocab-modal" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-full w-8 h-8 flex items-center justify-center transition-colors">&times;</button>
        <div class="flex items-center mb-6 border-b pb-4">
            <h3 id="vocab-word" class="text-3xl font-extrabold text-gray-900 capitalize tracking-tight"></h3>
        </div>
        <div class="flex items-center mb-5">
            <button id="play-audio-btn" class="flex items-center justify-center h-12 w-12 rounded-full bg-sky-50 text-sky-600 hover:bg-sky-600 hover:text-white mr-4 transition-all shadow-sm border border-sky-100" title="Listen to pronunciation">
                 <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
            </button>
            <p id="vocab-pronunciation-text" class="text-gray-500 font-mono text-lg bg-gray-50 px-3 py-1 rounded-md border border-gray-100"></p>
        </div>
        <p id="vocab-meaning" class="text-gray-700 text-lg leading-relaxed"></p>
    </div>
</div>

            passage: `
                <h3>Chimpanzee Intelligence and Habits</h3>
                <p>Some animals are actually very well-known for their outstanding intelligence compared to most other types of animals in the wild, one of the prime example is chimpanzee. Chimpanzee is a species of ape that is most closely related to humans, which inhabit in tropical forests and <span class="vocab-word" data-word="savannas">savannas</span>. Some basic knowledge about chimpanzees is that their diet is primarily vegetarian, consisting of mostly fruits, leaves, and seeds but also bird eggs and chicks, many insects, which provide them with enough nutrients for the development of mental ability.</p>
                <p>Chimpanzees are highly intelligent and are able to find solutions for many kinds of problems posed to them by human trainers and experimenters. Since the last few years of the 90s, a number of researchers have successfully taught chimpanzees to use sign languages including those based on the display of tokens or pictorial symbols. Also, communication between chimps in the wild takes the form of facial expressions, gestures, and a large array of <span class="vocab-word" data-word="vocalizations">vocalizations</span>, including screams, hoots, grunts, and roars.</p>
                <p>Chimpanzees are also well-known for their skills in using tools. In fact, various tools are used in several contexts. For example, Chimpanzees “fish” for termites and ants with tools made of grass stalks, vines, branches, peeled bark, and midribs of leaves. In other cases, they crack hard nuts open by using stones, roots, and wood as hammers, and they use “leafy sponges” (which are a handful of folded leaves or moss) to drink water.</p>

            questions: `

        // Tab 2: Example 2 - Fund Management

            title: 'Buying & Selling Decisions in Fund Management',
            passage: `
                <h3>Buying and Selling Decisions</h3>
                <p><span class="paragraph-label">B</span> Both books have since been pored over by a generation of hedge-fund wannabes. They are full of great stories and tips covering a range of investing styles. Yet there are common elements. It is striking, for instance, how little emphasis the wizards put on getting into a position—finding the right trade at the right entry price—compared with when to get out of it. That makes sense. Deciding what and when to sell surely matters at least as much as, and perhaps more than, deciding what to buy.</p>
                <p><span class="paragraph-label">E</span> The <span class="vocab-word" data-word="disparity">disparity</span> between sales and purchases is explained by the attention given to each. Fund managers are careful buyers. Purchases come at the end of a long period of serious thought and research. But they do not give stock sales anything like the same attention. That is especially true when they are stressed because their portfolio has recently done badly. Instead of <span class="vocab-word" data-word="deliberating">deliberating</span>, they use a mental shortcut. Stocks that have done either really well or really badly, and so stick in the mind, are far more likely to be sold. The more inclined fund managers are to sell in this way, the worse they perform.</p>
                <p><span class="paragraph-label">G</span> The message is clear. If fund managers took more care over selling, they would be more successful. But the world is not arranged in such a way as to make them take that care. They will be asked often for their best buying ideas, but rarely about stocks they own that are ripe for selling. This <span class="vocab-word" data-word="lopsided">lopsided</span> approach to decision-making is not confined to fund management. Businesses often spend an age deciding whom to hire but put off thinking about whom to let go until there is a pressing financial need, by which point the decision is likely to be rushed.</p>
                <p><span class="paragraph-label">H</span> Why do fund managers take their losses on bad stocks too late and their profits on good stocks too early? A body of empirical research finds that individual investors show a strong preference for selling winners over losers. They may be impatient to experience the burst of pride that comes from selling a winner. And they hold on to losers for too long in the hope of avoiding feelings of regret.</p>

            passage: `
                <h3>Energy Expenditure & Weight Loss</h3>
                <p><span class="paragraph-label">B</span> Some of the biggest clues that something was up with the exercise and weight loss equation lie far from the gym, on the plains of Tanzania. Here, the Hadza people live as we all once did, as hunter-gatherers. The men walk about 10 kilometres each day, stalking game with bows and arrows, while women spend hours on the move, digging for wild tubers and picking berries. A few years ago, Herman Pontzer, an evolutionary anthropologist, and his colleagues headed to Tanzania to study the Hadza and their <span class="vocab-word" data-word="metabolism">metabolism</span>. Pontzer wasn’t expecting to reveal any big mysteries around exercise. To the team’s amazement, the Hadza got through only slightly more than Westerners who drive to a job to sit all day, with the men using up about 2600 calories and the women 1900.</p>
                <p><span class="paragraph-label">C</span> The findings caused a stir. They called into question the widely accepted idea that <span class="vocab-word" data-word="sedentary">sedentary</span> lifestyles in many societies are responsible for the obesity epidemic. Lara Dugas’s team kitted out nearly 2000 people from the US, Ghana, Jamaica, South Africa and the Seychelles with activity monitors for eight days to gauge their basic pattern of physical activity. She then tracked their weight over several years. The upshot? Activity levels didn’t predict weight two years later. In fact, those who met exercise guidelines tended to have put on more weight than those that did less. A <span class="vocab-word" data-word="paradox">paradox</span> indeed.</p>
                <p><span class="paragraph-label">G</span> So another suggestion for this exercise paradox is that our bodies compensate for a hard workout by moving less the rest of the day. Some clues have come from mice. When given running wheels to prompt exercise, they were found to move around less than usual in between bouts of activity. The number of calories saved from moving less almost negated the calories burned from running.</p>
                <p><span class="paragraph-label">I</span> Ultimately, it is hard to avoid the conclusion that diet offers greater potential than exercise to get the calorie equation working more in your favour. But exercise does still have a place in the weight-loss journey. The Hadza are about three times more physically active than any Western population and have excellent heart health. Being active improves overall health, mobility and brain function, and reduces the risk for many chronic conditions including Alzheimer’s disease.</p>

    document.addEventListener('DOMContentLoaded', () => {
        const app = {
            currentTab: 0,
            currentFontSize: 17,

            // DOM Elements
            leftPane: document.getElementById('left-pane'),
            rightPane: document.getElementById('right-pane'),
            passageContainer: document.getElementById('passage-container'),
            questionsContainer: document.getElementById('questions-container'),
            tabNav: document.getElementById('tab-navigation'),
            splitter: document.getElementById('splitter'),
            highlightTooltip: document.getElementById('highlight-tooltip'),
            clearHighlightsBtn: document.getElementById('clear-highlights-btn'),
            vocabModal: document.getElementById('vocab-modal'),
            vocabModalContent: document.getElementById('vocab-modal-content'),
            closeVocabModalBtn: document.getElementById('close-vocab-modal'),
            vocabWordEl: document.getElementById('vocab-word'),
            vocabMeaningEl: document.getElementById('vocab-meaning'),
            vocabPronunciationText: document.getElementById('vocab-pronunciation-text'),
            playAudioBtn: document.getElementById('play-audio-btn'),

            init() {
                this.renderTabsNav();
                this.loadTabData(this.currentTab);
                this.setupEventListeners();
                this.initSplitter();
                this.initHighlighter();
            },

            renderTabsNav() {
                this.tabNav.innerHTML = tabsData.map((tab, idx) => `
                    <button class="tab-btn px-3 py-1.5 text-xs sm:text-sm font-semibold rounded-lg border border-gray-300 text-gray-700 bg-white hover:bg-gray-50 focus:outline-none ${idx === this.currentTab ? 'active' : ''}" data-idx="${idx}">
                        ${tab.label}
                    </button>
                `).join('');

                this.tabNav.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const targetIdx = parseInt(e.currentTarget.dataset.idx);
                        if (targetIdx !== this.currentTab) {
                            this.currentTab = targetIdx;
                            this.updateActiveTabUI();
                            this.loadTabData(this.currentTab);
                        }
                    });
                });
            },

            updateActiveTabUI() {
                this.tabNav.querySelectorAll('.tab-btn').forEach((btn, idx) => {
                    if (idx === this.currentTab) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
            },

            loadTabData(index) {
                const data = tabsData[index];
                this.passageContainer.innerHTML = data.passage;
                this.questionsContainer.innerHTML = data.questions;
                this.leftPane.scrollTop = 0;
                this.rightPane.scrollTop = 0;
            },

            setupEventListeners() {
                // Font Resizing
                document.getElementById('increase-font-btn').addEventListener('click', () => this.changeFontSize(1));
                document.getElementById('decrease-font-btn').addEventListener('click', () => this.changeFontSize(-1));

                // Clear Highlights
                if (this.clearHighlightsBtn) {
                    this.clearHighlightsBtn.addEventListener('click', () => {
                        const marks = this.leftPane.querySelectorAll('mark');
                        marks.forEach(mark => {
                            const text = document.createTextNode(mark.textContent);
                            mark.replaceWith(text);
                        });
                    });
                }

                // Vocab Modal Closing
                this.closeVocabModalBtn.addEventListener('click', () => this.closeModal());
                this.vocabModal.addEventListener('click', (e) => {
                    if (e.target === this.vocabModal) this.closeModal();
                });

                // Click handler for vocabulary words in text
                this.leftPane.addEventListener('click', (e) => {
                    if (e.target.classList.contains('vocab-word')) {
                        const wordKey = e.target.dataset.word;
                        this.openVocabModal(wordKey);
                    }
                    if (e.target.tagName === 'MARK') {
                        const textNode = document.createTextNode(e.target.textContent);
                        e.target.replaceWith(textNode);
                    }
                });

                // Audio Pronunciation TTS
                this.playAudioBtn.addEventListener('click', () => {
                    const word = this.vocabWordEl.textContent;
                    if (!word) return;
                    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                    
                    this.playAudioBtn.classList.remove('text-sky-600', 'bg-sky-50');
                    this.playAudioBtn.classList.add('bg-emerald-500', 'text-white');
                    
                    if ('speechSynthesis' in window) {
                        const utterance = new SpeechSynthesisUtterance(word);
                        utterance.lang = 'en-GB'; 
                        utterance.rate = 0.9; 
                        utterance.onend = () => this.resetAudioBtn();
                        utterance.onerror = () => this.resetAudioBtn();
                        window.speechSynthesis.speak(utterance);
                    } else {
                        setTimeout(() => this.resetAudioBtn(), 500);
                    }
                });
            },

            resetAudioBtn() {
                this.playAudioBtn.classList.add('text-sky-600', 'bg-sky-50');
                this.playAudioBtn.classList.remove('bg-emerald-500', 'text-white');
            },

            changeFontSize(delta) {
                this.currentFontSize += delta;
                if (this.currentFontSize < 14) this.currentFontSize = 14;
                if (this.currentFontSize > 26) this.currentFontSize = 26;
                document.documentElement.style.setProperty('--app-font-size', `${this.currentFontSize}px`);
            },

            openVocabModal(wordKey) {
                const data = vocabularyDict[wordKey] || { meaning: 'Definition available in context.', phonetic: '' };
                this.vocabWordEl.textContent = wordKey;
                this.vocabMeaningEl.textContent = data.meaning;
                this.vocabPronunciationText.textContent = data.phonetic || '';
                this.vocabModal.classList.remove('hidden');
                setTimeout(() => {
                    this.vocabModalContent.classList.remove('scale-95', 'opacity-0');
                    this.vocabModalContent.classList.add('scale-100', 'opacity-100');
                }, 10);
            },

            closeModal() {
                if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                this.vocabModalContent.classList.remove('scale-100', 'opacity-100');
                this.vocabModalContent.classList.add('scale-95', 'opacity-0');
                this.resetAudioBtn();
                setTimeout(() => this.vocabModal.classList.add('hidden'), 200);
            },

            initHighlighter() {
                document.body.addEventListener('mouseup', (e) => {
                    const selection = window.getSelection();
                    const selectedText = selection.toString().trim();

                    if (selectedText.length > 0) {
                        const range = selection.getRangeAt(0);
                        if (!this.leftPane.contains(range.commonAncestorContainer) && !this.rightPane.contains(range.commonAncestorContainer)) {
                            this.highlightTooltip.style.display = 'none';
                            return;
                        }

                        this.highlightTooltip.style.left = `${e.pageX - 30}px`;
                        this.highlightTooltip.style.top = `${e.pageY - 40}px`;
                        this.highlightTooltip.style.display = 'block';

                        this.highlightTooltip.onclick = () => {
                            const container = range.commonAncestorContainer;
                            if (container.nodeType === 3 && range.startContainer.parentElement !== range.endContainer.parentElement) {
                                this.highlightTooltip.style.display = 'none';
                                return;
                            }
                            
                            const mark = document.createElement('mark');
                            try {
                                range.surroundContents(mark);
                            } catch (ex) {} 
                            finally {
                                selection.removeAllRanges();
                                this.highlightTooltip.style.display = 'none';
                            }
                        };
                    } else {
                        this.highlightTooltip.style.display = 'none';
                    }
                });

                document.body.addEventListener('mousedown', (e) => {
                    if (e.target !== this.highlightTooltip && window.getSelection().toString().length === 0) {
                        this.highlightTooltip.style.display = 'none';
                    }
                });
            },

            initSplitter() {
                let isDragging = false;
                const contentPanes = document.getElementById('content-panes');

                this.splitter.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    isDragging = true;
                    document.body.style.cursor = 'col-resize';
                });

                document.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;
                    e.preventDefault();
                    if (window.innerWidth <= 768) return; 
                    
                    const containerRect = contentPanes.getBoundingClientRect();
                    const newLeftWidth = e.clientX - containerRect.left;
                    if (newLeftWidth > 200 && newLeftWidth < containerRect.width - 200) {
                        const newLeftPercent = (newLeftWidth / containerRect.width) * 100;
                        contentPanes.style.gridTemplateColumns = `${newLeftPercent}% 5px 1fr`;
                    }
                });

                document.addEventListener('mouseup', () => {
                    if (isDragging) {
                        isDragging = false;
                        document.body.style.cursor = 'default';
                    }
                });
            }
        };

        app.init();
    });
</script>
